<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanWear | Produto</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="logo" href="index.html">UrbanWear</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="produtos.html">Produtos</a>
        <a href="index.html#contato">Contato</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">
          🌙
        </button>
        <a class="cart" href="carrinho.html" aria-label="Ver carrinho">
          <span class="cart-icon" aria-hidden="true">🛒</span>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="product-detail container">
      <div class="product-image">
        <img data-product-image alt="" />
      </div>
      <div class="product-details">
        <p class="eyebrow" data-product-collection>Produto em destaque</p>
        <h1 data-product-name></h1>
        <p class="description" data-product-description></p>
        <p class="price" data-product-price></p>
        <button class="btn primary btn-add-cart" data-add-to-cart>
          Adicionar ao carrinho
        </button>
        <p class="note">Frete grátis nas compras acima de R$ 299.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div>
        <h4>UrbanWear</h4>
        <p>Moda urbana com propósito, estilo e conforto para o dia a dia.</p>
      </div>
      <p>© 2024 UrbanWear. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
